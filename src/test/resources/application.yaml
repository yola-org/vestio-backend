spring:
  cloud:
    aws:
      secretsmanager:
        # Tests use the literal settings below and do not fetch AWS secrets.
        enabled: false
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.ca-central-1.amazonaws.com/ca-central-1_test
          jwk-set-uri: https://cognito-idp.ca-central-1.amazonaws.com/ca-central-1_test/.well-known/jwks.json

# Literal dummy values so tests never touch AWS.
cognito:
  region: ca-central-1
  client-id: test-client-id
  client-secret: test-client-secret
  user-pool-id: ca-central-1_test
  token-expiration-seconds: 172800

aws:
  region: ca-central-1
  s3:
    assets-bucket: test-assets
    users-prefix: users
    listings-prefix: listings
  sqs:
    queues:
      image-processing: https://sqs.ca-central-1.amazonaws.com/000000000000/test-image-processing
