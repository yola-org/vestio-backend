databaseChangeLog:
  - changeSet:
      id: 004-create-listings
      author: youssef
      changes:
        - createTable:
            tableName: listings
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: CLOB
              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(50)
              - column:
                  name: brand_id
                  type: UUID
              - column:
                  name: condition
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_listing_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_listing_category
                    referencedTableName: categories
                    referencedColumnNames: id
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_listing_category
            tableName: listings
            columns:
              - column:
                  name: category_id
        - createIndex:
            indexName: idx_listing_user
            tableName: listings
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_listing_status
            tableName: listings
            columns:
              - column:
                  name: status
