databaseChangeLog:
  - changeSet:
      id: 007-create-favorites
      author: youssef-laarossi
      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: listing_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: favorites
            columnNames: user_id, listing_id
            constraintName: uq_favorites_user_listing
        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_favorites_user_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: listing_id
            referencedTableName: listings
            referencedColumnNames: id
            constraintName: fk_favorites_listing_id
            onDelete: CASCADE
        - createIndex:
            tableName: favorites
            indexName: idx_favorites_listing
            columns:
              - column:
                  name: listing_id
