databaseChangeLog:
  - changeSet:
      id: 006-create-listing-asset-keys
      author: vestio
      changes:
        - createTable:
            tableName: listing_asset_keys
            columns:
              - column:
                  name: listing_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: asset_key
                  type: UUID
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: listing_asset_keys
            columnNames: listing_id, position
            constraintName: pk_listing_asset_keys
        - addForeignKeyConstraint:
            baseTableName: listing_asset_keys
            baseColumnNames: listing_id
            referencedTableName: listings
            referencedColumnNames: id
            constraintName: fk_listing_asset_keys_listing
            onDelete: CASCADE
            onUpdate: CASCADE
