databaseChangeLog:
  - changeSet:
      id: 002-create-catalog-tables
      author: youssef
      changes:
        - createTable:
            tableName: size_groups
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: sizes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: size_group_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_size_group
                    referencedTableName: size_groups
                    referencedColumnNames: id

        - createTable:
            tableName: cities
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: image
                  type: VARCHAR(255)
              - column:
                  name: parent_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_category_parent
                    referencedTableName: categories
                    referencedColumnNames: id
              - column:
                  name: size_group_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_category_size_group
                    referencedTableName: size_groups
                    referencedColumnNames: id
