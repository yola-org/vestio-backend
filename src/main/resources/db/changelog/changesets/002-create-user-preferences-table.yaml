databaseChangeLog:
  - changeSet:
      id: 002-create-user-preferences-table
      author: youssef
      changes:
        - createTable:
            tableName: user_preferences
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_preference_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_preference_category
                    referencedTableName: categories
                    referencedColumnNames: id
