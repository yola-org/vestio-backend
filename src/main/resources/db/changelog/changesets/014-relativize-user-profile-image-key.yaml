databaseChangeLog:
  - changeSet:
      id: 014-relativize-user-profile-image-key
      author: codex
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: profile_image_key
                  valueComputed: SUBSTRING(profile_image_key, 7)
            where: "profile_image_key LIKE 'users/%'"
      rollback:
        - update:
            tableName: users
            columns:
              - column:
                  name: profile_image_key
                  valueComputed: "'users/' || profile_image_key"
            where: "profile_image_key IS NOT NULL AND profile_image_key NOT LIKE 'users/%'"
