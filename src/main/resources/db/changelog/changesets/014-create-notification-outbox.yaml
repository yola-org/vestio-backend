databaseChangeLog:
  - changeSet:
      id: 014-create-notification-outbox
      author: youssef
      changes:
        - createTable:
            tableName: notification_outbox
            columns:
              - column:
                  name: notification_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: listing_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: notification_outbox
            baseColumnNames: notification_id
            referencedTableName: notifications
            referencedColumnNames: id
            constraintName: fk_notification_outbox_notification
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notification_outbox
            baseColumnNames: listing_id
            referencedTableName: listings
            referencedColumnNames: id
            constraintName: fk_notification_outbox_listing
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notification_outbox
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notification_outbox_user
            onDelete: CASCADE
        - createIndex:
            tableName: notification_outbox
            indexName: idx_notification_outbox_listing_pending
            columns:
              - column:
                  name: listing_id
              - column:
                  name: published_at
      rollback:
        - dropTable:
            tableName: notification_outbox
