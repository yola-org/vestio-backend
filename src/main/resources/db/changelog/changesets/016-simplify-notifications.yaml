databaseChangeLog:
  - changeSet:
      id: 016-simplify-notifications
      author: youssef
      changes:
        - dropTable:
            tableName: notification_outbox
        - renameColumn:
            tableName: notifications
            oldColumnName: params
            newColumnName: payload
            columnDataType: JSONB
        - addColumn:
            tableName: notifications
            columns:
              - column:
                  name: listing_id
                  type: UUID
        - sql:
            sql: UPDATE notifications SET type = 'LISTING_CREATED' WHERE type = 'LISTING_PENDING'
        - sql:
            sql: UPDATE notifications SET type = 'LISTING_PUBLISHED' WHERE type = 'LISTING_READY'
  - changeSet:
      id: 016-extract-notification-listing-id
      author: youssef
      dbms: postgresql
      changes:
        - sql:
            sql: >-
              UPDATE notifications SET listing_id = (payload->>'listingId')::uuid
              WHERE payload->>'listingId' ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        - sql:
            sql: UPDATE notifications SET payload = payload - 'listingId' WHERE jsonb_exists(payload, 'listingId')
