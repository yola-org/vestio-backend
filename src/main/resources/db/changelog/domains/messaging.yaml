databaseChangeLog:
  - property:
      name: messageContentColumnType
      value: TEXT
      dbms: postgresql
  - property:
      name: messageContentColumnType
      value: VARCHAR
      dbms: h2
  - property:
      name: messageParamsColumnType
      value: JSONB
      dbms: postgresql
  - property:
      name: messageParamsColumnType
      value: JSON
      dbms: h2
  - changeSet:
      id: create-messaging-domain
      author: youssef
      changes:
        - addUniqueConstraint:
            tableName: listings
            columnNames: id, user_id
            constraintName: uq_listings_id_user
        - addUniqueConstraint:
            tableName: offers
            columnNames: id, listing_id, user_id
            constraintName: uq_offers_id_listing_user
        - createTable:
            tableName: chats
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: offer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: listing_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: buyer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: chats
            columnNames: listing_id, buyer_id
            constraintName: uq_chats_listing_buyer
        - addUniqueConstraint:
            tableName: chats
            columnNames: offer_id
            constraintName: uq_chats_offer
        - sql:
            sql: ALTER TABLE chats ADD CONSTRAINT ck_chats_distinct_users CHECK (owner_id <> buyer_id)
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: listing_id, owner_id
            referencedTableName: listings
            referencedColumnNames: id, user_id
            constraintName: fk_chats_listing_owner
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: offer_id, listing_id, buyer_id
            referencedTableName: offers
            referencedColumnNames: id, listing_id, user_id
            constraintName: fk_chats_offer_listing_buyer
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chats_owner_id
            onDelete: CASCADE
        - createIndex:
            tableName: chats
            indexName: idx_chats_owner
            columns:
              - column:
                  name: owner_id
        - addForeignKeyConstraint:
            baseTableName: chats
            baseColumnNames: buyer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_chats_buyer_id
            onDelete: CASCADE
        - createIndex:
            tableName: chats
            indexName: idx_chats_buyer
            columns:
              - column:
                  name: buyer_id
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: UUID
              - column:
                  name: content
                  type: ${messageContentColumnType}
              - column:
                  name: is_system
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: system_type
                  type: VARCHAR(50)
              - column:
                  name: params
                  type: ${messageParamsColumnType}
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: id
            constraintName: fk_messages_chat_id
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: sender_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_messages_sender_id
            onDelete: CASCADE
        - sql:
            sql: >-
              ALTER TABLE messages ADD CONSTRAINT ck_messages_kind CHECK (
                (is_system = TRUE AND system_type IS NOT NULL AND params IS NOT NULL)
                OR (is_system = FALSE AND sender_id IS NOT NULL AND system_type IS NULL AND params IS NULL
                    AND content IS NOT NULL AND LENGTH(TRIM(content)) > 0)
              )
        - createIndex:
            tableName: messages
            indexName: idx_messages_chat_created
            columns:
              - column:
                  name: chat_id
              - column:
                  name: created_at
              - column:
                  name: id
        - createIndex:
            tableName: messages
            indexName: idx_messages_sender
            columns:
              - column:
                  name: sender_id
      rollback:
        - dropTable:
            tableName: messages
        - dropTable:
            tableName: chats
        - dropUniqueConstraint:
            tableName: offers
            constraintName: uq_offers_id_listing_user
        - dropUniqueConstraint:
            tableName: listings
            constraintName: uq_listings_id_user
