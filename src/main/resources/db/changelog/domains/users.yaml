databaseChangeLog:
  - changeSet:
      id: create-users-domain
      author: youssef
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: password_changed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: age
                  type: INT
              - column:
                  name: gender
                  type: VARCHAR(50)
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: bio
                  type: VARCHAR(255)
              - column:
                  name: phone_number
                  type: VARCHAR(50)
              - column:
                  name: profile_image_key
                  type: VARCHAR(512)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: pins
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    deleteCascade: true
                    foreignKeyName: fk_pin_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: purpose
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: pin_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: pins
            indexName: idx_pins_user_purpose_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: purpose
              - column:
                  name: created_at
        - createTable:
            tableName: user_preferences
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    deleteCascade: true
                    foreignKeyName: fk_user_preference_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_preference_category
                    referencedTableName: categories
                    referencedColumnNames: id
              - column:
                  name: gender
                  type: VARCHAR(50)
        - addUniqueConstraint:
            tableName: user_preferences
            columnNames: user_id, category_id
            constraintName: uq_user_preferences_user_category
        - createIndex:
            tableName: user_preferences
            indexName: idx_user_preferences_category
            columns:
              - column:
                  name: category_id
      rollback:
        - dropTable:
            tableName: pins
        - dropTable:
            tableName: user_preferences
        - dropTable:
            tableName: users
