databaseChangeLog:
  - changeSet:
      id: create-catalog-domain
      author: youssef
      changes:
        - createTable:
            tableName: size_groups
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: sizes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: size_group_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_size_group
                    referencedTableName: size_groups
                    referencedColumnNames: id

        - createTable:
            tableName: cities
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: image
                  type: VARCHAR(255)
              - column:
                  name: parent_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_category_parent
                    referencedTableName: categories
                    referencedColumnNames: id
              - column:
                  name: size_group_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_category_size_group
                    referencedTableName: size_groups
                    referencedColumnNames: id
        - addUniqueConstraint:
            tableName: sizes
            columnNames: size_group_id, name
            constraintName: uq_sizes_group_name
        - createIndex:
            tableName: categories
            indexName: idx_categories_parent
            columns:
              - column:
                  name: parent_id
        - createIndex:
            tableName: categories
            indexName: idx_categories_size_group
            columns:
              - column:
                  name: size_group_id
      rollback:
        - dropTable:
            tableName: categories
        - dropTable:
            tableName: cities
        - dropTable:
            tableName: sizes
        - dropTable:
            tableName: size_groups
