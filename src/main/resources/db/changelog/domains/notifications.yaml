databaseChangeLog:
  - property:
      name: notificationPayloadType
      value: JSONB
      dbms: postgresql
  - property:
      name: notificationPayloadType
      value: JSON
      dbms: h2
  - changeSet:
      id: create-notifications-domain
      author: youssef-laarossi
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: ${notificationPayloadType}
                  constraints:
                    nullable: false

              - column:
                  name: listing_id
                  type: UUID

              - column:
                  name: read_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_users
            onDelete: CASCADE
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_created_id
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
              - column:
                  name: id
                  descending: true

        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_read
            columns:
              - column:
                  name: user_id
              - column:
                  name: read_at

      rollback:
        - dropTable:
            tableName: notifications
