spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${cognito.issuer-uri}
          jwk-set-uri: ${cognito.jwk-set-uri}

# Local Cognito: loaded from AWS Secrets Manager at startup via your AWS
# profile (AWS_PROFILE or ~/.aws/credentials). Secret name defaults to
# vestio-dev/cognito-client-secret (override with the cognito.secret-name property).
cognito:
  region: ${cognito.region:ca-central-1}
  client-id: ${cognito.client-id}
  client-secret: ${cognito.client-secret}
  user-pool-id: ${cognito.user-pool-id}

logging:
  level:
    org.app.vestiobackend: DEBUG
    org.springframework.web: DEBUG
