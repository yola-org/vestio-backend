spring:
  config:
    import:
      - aws-secretsmanager:DEV/COGNITO/CLIENT_ID?prefix=COGNITO.
      - aws-secretsmanager:DEV/COGNITO/JWK_SET_URI?prefix=COGNITO.
      - aws-secretsmanager:DEV/COGNITO/CLIENT_SECRET?prefix=COGNITO.
      - aws-secretsmanager:DEV/COGNITO/ISSUER_URI?prefix=COGNITO.
      - aws-secretsmanager:DEV/COGNITO/REGION?prefix=COGNITO.
      - aws-secretsmanager:DEV/COGNITO/USER_POOL_ID?prefix=COGNITO.
      - aws-secretsmanager:DEV/S3/ASSETS_BUCKET_NAME
      - aws-secretsmanager:DEV/SQS/IMAGE_OPTIMIZATION_QUEUE_URL
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO.ISSUER_URI}
          jwk-set-uri: ${COGNITO.JWK_SET_URI}

# Local development uses the same unprefixed COGNITO_* names as deployed
# environments. LocalCognitoSecretsEnvironmentPostProcessor resolves any missing
# value from the matching DEV_* Secrets Manager entry using the default AWS
# credentials chain (AWS_PROFILE or instance profile). The dev deployment, like
# prod, gets COGNITO_* from the launch template instead.
cognito:
  region: ca-central-1
  client-id: ${COGNITO.CLIENT_ID}
  client-secret: ${COGNITO.CLIENT_SECRET}
  user-pool-id: ${COGNITO.USER_POOL_ID}

# Keep the same environment-variable contract as deployed environments. The ASG
# launch template supplies these values in AWS; local development can export them.
aws:
  region: ${AWS_REGION:ca-central-1}
  s3:
    assets-bucket: ${ASSETS_BUCKET_NAME}
    users-prefix: users
    listings-prefix: listings
  sqs:
    queues:
      image-processing: ${IMAGE_OPTIMIZATION_QUEUE_URL}

logging:
  level:
    org.app.vestiobackend: DEBUG
    org.springframework.web: DEBUG
