<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f7f3ea;color:#151515;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f7f3ea;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;">
        <tr><td style="padding:0 0 24px;font-size:36px;font-weight:800;letter-spacing:-2px;">vestio<span style="color:#ff5d39;">.</span></td></tr>
        <tr><td style="padding:32px;background-color:#d8f05e;border-radius:20px 20px 0 0;">
          <p style="margin:0 0 20px;font-size:12px;font-weight:bold;letter-spacing:2px;">{{eyebrow}}</p>
          <h1 style="margin:0;font-size:40px;line-height:1.1;letter-spacing:-1.5px;">{{heading}}</h1>
        </td></tr>
        <tr><td style="padding:32px;background-color:#ffffff;border-radius:0 0 20px 20px;">
          {{content}}
        </td></tr>
        <tr><td align="center" style="padding:24px 12px;font-size:12px;line-height:1.6;color:#666666;">La mode circule. Les histoires continuent.<br>Cet e-mail concerne votre compte Vestio.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
