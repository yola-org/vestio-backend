spring:
  application:
    name: vestio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${cognito.issuer-uri}
          jwk-set-uri: ${cognito.jwk-set-uri}

cognito:
  # Values are loaded from AWS Secrets Manager at startup
  # (see CognitoEnvironmentPostProcessor). No environment variables exist.
  region: ${cognito.region}
  client-id: ${cognito.client-id}
  client-secret: ${cognito.client-secret}
  user-pool-id: ${cognito.user-pool-id}
  # Note: Access and ID tokens in Cognito have a maximum validity of 24 hours.
  # Refresh tokens can be configured for longer durations (e.g., 48 hours or more).
  token-expiration-seconds: 172800
