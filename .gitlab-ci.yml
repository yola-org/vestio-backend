# Spring Boot backend pipeline.

stages:
  - test
  - secret-detection
  - build

default:
  image: eclipse-temurin:25-jdk
  interruptible: true

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  # Run Secret Detection in MR pipelines as well as branch pipelines.
  AST_ENABLE_MR_PIPELINES: "true"

# Branch + MR pipelines, no duplicates, no tags.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

cache:
  key: "gradle-$CI_PROJECT_NAME"
  paths:
    - .gradle/caches
    - .gradle/wrapper

tests:
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew test

build:
  stage: build
  needs:
    - job: tests
      artifacts: false
  script:
    - chmod +x gradlew
    - ./gradlew assemble -x test
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 day

# `needs: []` starts the security scans immediately, in parallel with tests.
# The SAST analyzers inherit `needs` from the `sast` job through `extends`.
sast:
  stage: test
  needs: []

secret_detection:
  stage: secret-detection
  needs: []

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
