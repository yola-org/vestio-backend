import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'com.github.spotbugs' version '6.5.13'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.app'
version = '0.0.1-SNAPSHOT'
description = 'vestio-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.yaml:snakeyaml'
    implementation 'software.amazon.awssdk:cognitoidentityprovider:2.57.0'
    implementation 'software.amazon.awssdk:secretsmanager:2.29.0'
    implementation 'software.amazon.awssdk:s3:2.29.0'
    implementation 'software.amazon.awssdk:sqs:2.29.0'
    implementation 'org.mapstruct:mapstruct:1.6.2'
    // Source: https://mvnrepository.com/artifact/io.awspring.cloud/spring-cloud-aws-starter-secrets-manager
    implementation("io.awspring.cloud:spring-cloud-aws-starter-secrets-manager:4.2.1")
    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

spotless {
    java {
        trimTrailingWhitespace()
        endWithNewline()
    }
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
    }
}

spotbugs {
    // Report existing findings while the project establishes a baseline.
    ignoreFailures = true
}

tasks.withType(SpotBugsTask).configureEach {
    reports.create('html') {
        required = true
    }
}

tasks.named('bootRun') {
    args '--spring.profiles.active=local'
}
