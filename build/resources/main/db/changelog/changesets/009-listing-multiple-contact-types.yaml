databaseChangeLog:
  - changeSet:
      id: 009-listing-multiple-contact-types
      author: youssef
      changes:
        - createTable:
            tableName: listing_contact_types
            columns:
              - column:
                  name: listing_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_listing_contact_types_listing
                    referencedTableName: listings
                    referencedColumnNames: id
              - column:
                  name: contact_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - sql:
            sql: "INSERT INTO listing_contact_types (listing_id, contact_type) SELECT id, contact_type FROM listings"

        - dropNotNullConstraint:
            columnName: contact_type
            tableName: listings
        
        - dropColumn:
            columnName: contact_type
            tableName: listings
